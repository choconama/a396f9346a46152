<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LHビューア">
<meta name="theme-color" content="#141218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LHビューア</title>
<style>
:root{
  --bg:#141218; --panel:#1e1b24; --panel2:#27232f; --line:#3a3444; --text:#ece8f1; --muted:#a79fb3;
  --accent:#e2557a; --accent2:#f2a3b8; --ok:#7cc8a0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}

/* ---------- setup screen */
#setup{max-width:880px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:.04em}
h1 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.lead{color:var(--muted);margin:0 0 24px;line-height:1.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--accent2);font-weight:600}
#status{color:var(--muted);font-size:14px;margin-top:10px;min-height:1.4em}
#status.ok{color:var(--ok)}
#status.err{color:#ff8a8a}
.group{margin-bottom:14px}
.group h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:500;letter-spacing:.08em}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.route{text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel2)}
.route.sel{border-color:var(--accent);background:#3a2230}
.route .sub{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:6px}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
#startRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#resumeBtn{font-size:14px}

/* ---------- player */
#player{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{position:relative;aspect-ratio:1024/600;width:min(100vw,calc((100vh - 52px) * 1024 / 600));max-height:calc(100vh - 52px)}
canvas{width:100%;height:100%;display:block;background:#000}
#box{position:absolute;left:3%;right:3%;bottom:3%;min-height:24%;background:linear-gradient(180deg,rgba(20,14,26,.78),rgba(20,14,26,.9));
  border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:2.2% 3% 2.4%;font-size:clamp(13px,2.05vw,21px);line-height:1.65;
  text-shadow:0 1px 2px #000;white-space:pre-wrap;cursor:pointer;transition:opacity .2s}
#box.off{opacity:0;pointer-events:none}
#name{position:absolute;top:-1.4em;left:2.4%;background:var(--accent);color:#fff;font-size:.82em;padding:.1em .9em;border-radius:6px;font-weight:600}
#name:empty{display:none}
#sceneTag{position:absolute;top:10px;left:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:6px;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#endCard{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:22px}
#bar{height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#121016;border-top:1px solid #2a2530;overflow-x:auto}
#bar button{padding:6px 10px;font-size:14px;white-space:nowrap}
#bar .on{background:var(--accent);border-color:var(--accent);color:#fff}
#bar .sep{flex:1}
.volbtn{display:none}
@media (max-width:700px){.volbtn{display:inline-block}}
#bar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
#bar input[type=range]{width:80px}
#prog{font-size:12px;color:var(--muted);white-space:nowrap}
#scenes{position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);background:rgba(18,16,22,.97);border-left:1px solid var(--line);overflow:auto;padding:12px}
#scenes h3{margin:4px 4px 10px;font-size:14px;color:var(--accent2)}
#scenes ol{list-style:none;margin:0;padding:0}
#scenes li{padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
#scenes li:hover{background:var(--panel2);color:var(--text)}
#scenes li.cur{background:#3a2230;color:#fff}
#scenes li.done{opacity:.6}
html,body{-webkit-text-size-adjust:100%;touch-action:manipulation}
#setup{padding-top:max(24px,env(safe-area-inset-top))}
#player{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
#dataInfo{font-size:14px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width: 700px){
  #bar{height:46px;gap:4px;padding:0 6px}
  #bar button{padding:6px 8px;font-size:13px}
  #bar label{display:none}
  #bar.showvol label{display:flex}
  #screen{width:min(100vw,calc((100vh - 46px) * 1024 / 600))}
}
@media (orientation: portrait){
  #stage{align-items:flex-start;padding-top:8px}
  #screen{width:100vw;max-height:none}
  #box{top:calc(100% + 10px);bottom:auto;left:10px;right:10px;min-height:9em;font-size:16px;padding:16px 16px 18px}
  #name{top:-1.3em}
  #scenes{top:0}
}
</style>
</head>
<body>

<div id="setup">
  <h1>LHビューア <small>選択肢なしでルートを流し見</small></h1>
  <p class="lead">データは一度読み込めば、この端末の中に保存されてオフラインで再生できます。どこにも送信しません。</p>

  <div class="card">
    <h2>1. データ</h2>
    <div id="dataInfo">PCで作った分割データ（lh.pack.001of… から始まるファイル）を全部選んで、最初に1回だけ読み込みます。</div>
    <div class="btnrow">
      <button id="importBtn" class="primary">データを読み込む…</button>
      <button id="deleteBtn" class="hidden">データを削除</button>
    </div>
    <input id="partsInput" type="file" multiple class="hidden">
    <div class="progress hidden" id="impProg"><div></div></div>
    <div id="status">データを確認しています…</div>
  </div>

  <div class="card" id="routeCard">
    <h2>2. ルートを選ぶ</h2>
    <div id="routeList"></div>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="skipCommon"> 共通部分（オープニング・共通ルート）を飛ばす</label>
    </div>
  </div>

  <div id="startRow">
    <button id="startBtn" class="primary" disabled>再生開始</button>
    <button id="resumeBtn" class="hidden"></button>
  </div>
</div>

<div id="player" class="hidden">
  <div id="stage">
    <div id="screen">
      <canvas id="cv" width="1024" height="600"></canvas>
      <div id="sceneTag"></div>
      <div id="box" class="off"><div id="name"></div><div id="text"></div></div>
      <div id="endCard" class="hidden"><div id="endText">おわり</div><button id="endBack" class="primary">ルート選択に戻る</button></div>
    </div>
    <div id="scenes" class="hidden"><h3>シーン一覧（クリックで移動）</h3><ol id="sceneList"></ol></div>
  </div>
  <div id="bar">
    <button id="bMenu" title="ルート選択に戻る (Esc)">☰ 戻る</button>
    <button id="bAuto" class="on" title="オート再生 (A)">▶ オート</button>
    <button id="bNext" title="次の文 (Space / クリック)">次へ</button>
    <button id="bSkipScene" title="このシーンを飛ばす (S)">シーン送り ⏭</button>
    <button id="bList" title="シーン一覧 (L)">一覧</button>
    <button id="bFast" title="早送り (Ctrlを押している間も)">⏩ 早送り</button>
    <button id="bVol" class="volbtn">音量</button>
    <span id="prog"></span>
    <span class="sep"></span>
    <label>待ち <input id="rSpeed" type="range" min="0" max="3000" step="100" value="700"></label>
    <label>BGM <input id="rBgm" type="range" min="0" max="100" value="45"></label>
    <label>効果音 <input id="rSe" type="range" min="0" max="100" value="70"></label>
    <label>ボイス <input id="rVo" type="range" min="0" max="100" value="100"></label>
  </div>
</div>

<script>// LoveHolic route viewer engine (data parsing + script interpreter)
// Works in browser and Node. Reads game files read-only through "sources":
//   source = { name, size, read(offset, length) -> Promise<Uint8Array> }
(function (global) {
'use strict';

const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
const i32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24));
const i16 = (b, o) => { const v = u16(b, o); return v & 0x8000 ? v - 0x10000 : v; };
const utf16 = new TextDecoder('utf-16le');
const sjis = new TextDecoder('shift_jis');
const ascii = (b, o, n) => String.fromCharCode.apply(null, b.subarray(o, o + n));

// ---------------------------------------------------------------- LINK6 archive
async function openArc(src, cache) {
  const ckey = 'idx:' + src.name + ':' + src.size + ':' + (src.mtime || 0);
  const mk = (byName, byStem) => ({ src, byName, byStem, async raw(ent) { return src.read(ent.off, ent.size); } });
  if (cache) {
    const c = cache.get(ckey);
    if (c && c.length) {
      const byStem = new Map(), byName = new Map();
      for (let i = 0; i < c.length; i += 4) {
        const name = c[i]; const ent = { name, off: c[i + 1], size: c[i + 2], flags: c[i + 3] };
        byName.set(name, ent); const dot = name.lastIndexOf('.'); byStem.set(dot > 0 ? name.slice(0, dot) : name, ent);
      }
      return mk(byName, byStem);
    }
  }
  const head = await src.read(0, 8);
  if (ascii(head, 0, 5) !== 'LINK6') throw new Error(src.name + ': not LINK6');
  let pos = 8 + head[7];
  const byStem = new Map();
  const byName = new Map();
  // read headers in chunks to reduce I/O calls
  let bufStart = -1, buf = null;
  const CH = 1 << 16; let small = false; let firstSize = 0;
  async function get(off, len) {
    if (buf && off >= bufStart && off + len <= bufStart + buf.length) return buf.subarray(off - bufStart, off - bufStart + len);
    const n = Math.max(len, small ? 512 : CH);
    buf = await src.read(off, Math.min(n, src.size - off)); bufStart = off;
    return buf.subarray(0, len);
  }
  while (pos + 15 <= src.size) {
    const h = await get(pos, 15);
    const size = u32(h, 0);
    if (!size) break;
    const flags = u16(h, 4);
    const nl = u16(h, 13);
    const nb = await get(pos + 15, nl);
    const name = utf16.decode(nb);
    const off = pos + 15 + nl;
    const ent = { name, off, size: pos + size - off, flags };
    if (!firstSize) { firstSize = size; small = size > 8192; }
    byName.set(name, ent);
    const dot = name.lastIndexOf('.');
    byStem.set(dot > 0 ? name.slice(0, dot) : name, ent);
    pos += size;
  }
  if (cache) { const flat = []; for (const e of byName.values()) flat.push(e.name, e.off, e.size, e.flags); cache.set(ckey, flat); }
  return mk(byName, byStem);
}

// ---------------------------------------------------------------- params.dat
function findUtf16(buf, s, from) {
  const pat = new Uint8Array(s.length * 2);
  for (let i = 0; i < s.length; i++) { pat[i * 2] = s.charCodeAt(i) & 255; pat[i * 2 + 1] = s.charCodeAt(i) >> 8; }
  outer: for (let i = from || 0; i <= buf.length - pat.length; i++) {
    for (let j = 0; j < pat.length; j++) if (buf[i + j] !== pat[j]) continue outer;
    return i;
  }
  return -1;
}

function parseParams(b) {
  // resource table: [u32 count][u16 ?] then entries [u8 flag][u16 len][utf16], flag1 -> [u32 n] n strings then a string
  const at = findUtf16(b, '.scr', 0);
  if (at < 0) throw new Error('params.dat: resource table not found');
  // walk back to the start of that string: find p such that u16(p) == at+8-(p+2) and b[p-1]==0
  let p = -1;
  for (let q = at - 2; q > at - 400; q -= 2) {
    if (u16(b, q) === at + 8 - (q + 2)) { p = q - 1; break; }
  }
  if (p < 0) throw new Error('params.dat: table start not found');
  const count = u32(b, p - 6); // count includes reserved slot 0
  const res = [null];
  const rs = () => { const n = u16(b, p); const s = utf16.decode(b.subarray(p + 2, p + 2 + n)); p += 2 + n; return s; };
  for (let i = 1; i < count; i++) {
    const flag = b[p++];
    if (flag === 0) res.push(rs());
    else if (flag === 1) { const n = u32(b, p); p += 4; for (let k = 0; k < n; k++) rs(); res.push(rs()); }
    else throw new Error('params.dat: bad flag ' + flag + ' at ' + p);
  }
  // image table
  if (u32(b, p) > 100000) p++; // one padding byte after the name table
  const ic = u32(b, p); p += 4;
  const imgs = [];
  for (let i = 0; i < ic; i++) {
    const c = b[p++]; const a = [];
    for (let k = 0; k < c; k++) { a.push(u32(b, p)); p += 4; }
    imgs.push(a);
  }
  // decryption key: int32 length (w*h*4 of the screen) followed by key bytes
  let key = null;
  for (let q = 0x400; q < b.length - 4; q++) {
    const n = u32(b, q);
    if (n === 1024 * 600 * 4 && q + 4 + n <= b.length) { key = b.slice(q + 4, q + 4 + n); break; }
  }
  return { res, imgs, key };
}

// ---------------------------------------------------------------- message.dat
function parseMessages(b) {
  const not = (o, n) => { const t = new Uint8Array(n); for (let i = 0; i < n; i++) t[i] = 255 - b[o + i]; return t; };
  let p = 0x15;
  const nn = u32(b, p); p += 4;
  const names = [];
  for (let i = 0; i < nn; i++) { const n = u16(b, p); names.push(sjis.decode(not(p + 2, n))); p += 2 + n; }
  const nc = u32(b, p); p += 4;
  const choices = [];
  for (let i = 0; i < nc; i++) { const n = u16(b, p); choices.push(sjis.decode(not(p + 2, n))); p += 2 + n; }
  const nm = u32(b, p); p += 4;
  const rtext = new Array(nm), rvoice = new Array(nm);
  for (let i = 0; i < nm && p + 4 <= b.length; i++) {
    const L = u32(b, p); const r = not(p + 4, L); p += 4 + L;
    const tl = u32(r, 0);
    rtext[i] = sjis.decode(r.subarray(4, 4 + tl)).replace(/\n$/, '');
    rvoice[i] = r[4 + tl] ? utf16.decode(r.subarray(5 + tl)).replace(/\0+$/, '') : '';
  }
  // message id -> [speaker name index, record list]
  const ne = u32(b, p); p += 4;
  const text = new Array(ne), voice = new Array(ne), speaker = new Int32Array(ne);
  for (let i = 0; i < ne; i++) {
    speaker[i] = i32(b, p); const c = b[p + 4]; const rec = u32(b, p + 5); p += 5 + 4 * c;
    text[i] = rtext[rec]; voice[i] = rvoice[rec];
  }
  return { names, choices, text, voice, speaker };
}

// ---------------------------------------------------------------- scripts
function parseScript(name, b) {
  if (ascii(b, 0, 12) !== '[SCR-Ver5.1]') throw new Error(name + ': bad header');
  const clen = u32(b, 12);
  const ins = [];           // {pos, op, p}
  const at = new Map();     // file offset -> instruction index
  let pos = 16;
  while (pos < 16 + clen) {
    const op = u16(b, pos), ln = u16(b, pos + 2);
    if (ln < 4) throw new Error(name + ': bad op at ' + pos);
    at.set(pos, ins.length);
    ins.push({ pos, op, p: b.subarray(pos + 4, pos + ln) });
    pos += ln;
  }
  // [LAYER] states
  let states = [];
  const li = (() => { for (let i = pos; i < b.length - 7; i++) if (b[i] === 0x5b && ascii(b, i, 7) === '[LAYER]') return i; return -1; })();
  if (li >= 0) {
    let q = li + 7; const n = u32(b, q); q += 4;
    const offs = []; for (let i = 0; i < n; i++) offs.push(u32(b, q + i * 4));
    const base = q + 4 * n;
    for (let i = 0; i < n; i++) {
      const s = base + offs[i], e = i + 1 < n ? base + offs[i + 1] : b.length;
      const blob = b.subarray(s, e); const layers = [];
      let k = 1;
      while (k + 2 <= blob.length) {
        const sz = u16(blob, k); if (sz < 2) break;
        const x = blob.subarray(k + 2, k + sz); k += sz;
        layers.push({ img: u32(x, 0), z: x[4], dx: i16(x, 5), dy: i16(x, 7) });
      }
      states.push(layers);
    }
  }
  return { name, ins, at, states };
}

// static analysis of choice menus: returns plan info per script
// For each "cmp v0 == K / jf T" find first "v112 = X" in branch (affection gain) and whether it sets v111 = 0
function analyzeChoices(sc) {
  const ins = sc.ins; const gains = {}; const ends = {};
  const isCmpV0 = (x) => x.op === 0x0d && x.p[0] === 0x12 && x.p[1] === 0 && u32(x.p, 4) === 0;
  const imm = (x) => i32(x.p, 8);
  for (let i = 0; i < ins.length; i++) {
    const x = ins[i];
    if (!isCmpV0(x)) continue;
    const K = imm(x); const j = ins[i + 1];
    if (!j || j.op !== 0x0f) continue;
    const T = sc.at.get(u32(j.p, 3));
    const scan = (from, to) => {
      let g = null, e = false;
      for (let k = from; k < to && k < ins.length; k++) {
        const y = ins[k];
        if (isCmpV0(y) && k > from) break;
        if (y.op === 1 && y.p[0] === 0x18 && u16(y.p, 2) === 112 && g === null) g = i32(y.p, 8);
        if (y.op === 1 && y.p[0] === 0x18 && u16(y.p, 2) === 111 && i32(y.p, 8) === 0) e = true;
      }
      return [g, e];
    };
    if (!(K in gains)) { const [g, e] = scan(i + 2, T == null ? ins.length : T); gains[K] = g; ends[K] = e; }
    // two-option menus: the else branch is option 1
    if (K === 0 && T != null && !(1 in gains)) {
      const nxt = ins[T];
      if (!isCmpV0(nxt)) { const [g, e] = scan(T, ins.length); gains[1] = g; ends[1] = e; }
    }
  }
  return { gains, ends };
}

// ---------------------------------------------------------------- data bundle
async function loadGame(files, progress, cache) {
  const need = n => { const f = files.get(n.toLowerCase()); if (!f) throw new Error(n + ' が見つかりません'); return f; };
  const full = async n => { const f = need(n); return f.read(0, f.size); };
  progress && progress('params.dat');
  const params = parseParams(await full('params.dat'));
  progress && progress('message.dat');
  const msg = parseMessages(await full('message.dat'));
  progress && progress('scr.arc');
  const scrArc = await openArc(need('scr.arc'));
  const arcs = { scr: scrArc };
  const arcNames = ['bgd', 'bgm', 'sed', 'sp00', 'sp01', 'cg00', 'cg01', 'cg02', 'cg03', 'cg04', 'cg05', 'voice00', 'voice01', 'voice02'];
  let done = 0;
  progress && progress('アーカイブ (0/' + arcNames.length + ')');
  await Promise.all(arcNames.map(async a => {
    arcs[a] = await openArc(need(a + '.arc'), cache);
    done++; progress && progress('アーカイブ (' + done + '/' + arcNames.length + ')');
  }));
  return makeGame(params, msg, arcs);
}

function makeGame(params, msg, arcs) {
  const scrArc = arcs.scr;
  const scripts = new Map();
  async function script(name) {
    if (scripts.has(name)) return scripts.get(name);
    const ent = scrArc.byName.get(name);
    if (!ent) throw new Error('script not found: ' + name);
    const sc = parseScript(name, await scrArc.raw(ent));
    sc.choice = analyzeChoices(sc);
    scripts.set(name, sc); return sc;
  }
  function resolve(resName) { // "X.cg00" -> {arc, ent}
    if (!resName) return null;
    const dot = resName.lastIndexOf('.'); if (dot < 0) return null;
    const a = arcs[resName.slice(dot + 1)]; if (!a) return null;
    const ent = a.byStem.get(resName.slice(0, dot)); if (!ent) return null;
    return { arc: a, ent };
  }
  return { params, msg, arcs, script, resolve };
}

// ---------------------------------------------------------------- converted data pack (for phones)
// layout: "LHPK1\0\0\0" u32 jsonLen, json {index:{"arc/name":[off,size,kind,...]}}, blobs
async function loadPack(src, progress) {
  const h = await src.read(0, 12);

    setStatus('準備完了。ルートを選んでください。', 'ok');
    const probe = document.createElement('audio');
    if (!probe.canPlayType('audio/ogg; codecs=vorbis')) setStatus('準備完了。※このブラウザはOgg音声に未対応のため音が鳴りません（iPhoneはiOS 18.4以降が必要です）', 'err');
    refreshStart();
  }catch(e){ console.error(e); setStatus('エラー: ' + e.message, 'err'); }
}
$('importBtn').onclick = () => $('partsInput').click();
$('partsInput').onchange = async e => {
  const files = [...e.target.files].filter(f => /lh\.pack\.\d+of\d+$/.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
  e.target.value = '';
  if (!files.length){ setStatus('lh.pack.001of… という名前のファイルを選んでください。', 'err'); return; }
  const count = +/of(\d+)$/.exec(files[0].name)[1];
  const have = new Set(files.map(f => +/\.(\d+)of/.exec(f.name)[1]));
  const missing = []; for (let i = 1; i <= count; i++) if (!have.has(i)) missing.push(i);
  if (missing.length){ setStatus('足りないファイルがあります：' + missing.slice(0,10).map(i=>String(i).padStart(3,'0')).join(', ') + (missing.length>10?' ほか':'') + '（全部で' + count + '個必要）', 'err'); return; }
  try{
    if (navigator.storage && navigator.storage.persist) await navigator.storage.persist().catch(()=>{});
    game = null; refreshStart();
    await IDB.clear();
    let total = 0;
    for (let i = 0; i < count; i++){
      setStatus('保存中… ' + (i+1) + ' / ' + count); setProg(i / count);
      // copy into memory first so the stored blob does not depend on the picked file
      const buf = await files[i].arrayBuffer();
      await IDB.put('parts', i, new Blob([buf]));
      total += files[i].size;
    }
    await IDB.put('meta', 'pack', { count, total, at: Date.now() });
    setProg(null);
    await openStored();
  }catch(err){ console.error(err); setProg(null); setStatus('エラー: ' + ((err && (err.message || err.name)) || '保存に失敗しました') + '（空き容量が足りない可能性があります）', 'err'); }
};
$('deleteBtn').onclick = async () => {
  if (!confirm('この端末に保存したデータを削除しますか？')) return;
  await IDB.clear(); game = null; $('deleteBtn').classList.add('hidden'); refreshStart(); setStatus('削除しました。');
};
openStored();

// ---------------------------------------------------------------- route list
(function buildRoutes(){
  const groups = {};
  for (const r of RT.ROUTES) (groups[r.group] = groups[r.group] || []).push(r);
  const box = $('routeList');
  for (const g in groups){
    const d = document.createElement('div'); d.className='group';
    d.innerHTML = '<h3>'+g+'</h3>'; const grid = document.createElement('div'); grid.className='routes';
    for (const r of groups[g]){
      const b = document.createElement('button'); b.className='route'; b.dataset.id=r.id;
      b.innerHTML = r.name + '<span class="sub">' + (r.desc||'') + '</span>';
      b.onclick = () => { selected = r; document.querySelectorAll('.route').forEach(x=>x.classList.toggle('sel', x===b)); refreshStart(); };
      grid.appendChild(b);
    }
    d.appendChild(grid); box.appendChild(d);
  }
  $('skipCommon').checked = store.get('skipCommon') ?? true;
  $('skipCommon').onchange = () => store.set('skipCommon', $('skipCommon').checked);
})();
function refreshStart(){
  $('startBtn').disabled = !(game && selected);
  const last = store.get('last');
  const r = last && RT.ROUTES.find(x=>x.id===last.id);
  if (game && r && last.step > 0){ $('resumeBtn').classList.remove('hidden'); $('resumeBtn').textContent = '続きから：' + r.name + '（' + (last.step+1) + '番目のシーン）'; }
  else $('resumeBtn').classList.add('hidden');
}
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockAudio(){ for (const el of [bgmEl, voEl, ...Array.from({length:8},(_,i)=>seCh[i] || (seCh[i] = new Audio()))]){ try{ if (!el.src){ el.src = SILENT_WAV; } const p = el.play(); p && p.then(()=>{ if (el.src === SILENT_WAV) el.pause(); }).catch(()=>{}); }catch(e){} } }
$('startBtn').onclick = () => { unlockAudio(); startRoute(selected, !$('skipCommon').checked, 0); };
$('resumeBtn').onclick = () => { unlockAudio(); const l = store.get('last'); const r = RT.ROUTES.find(x=>x.id===l.id); startRoute(r, l.common, l.step); };

// ---------------------------------------------------------------- media
const cv = $('cv'), ctx = cv.getContext('2d');
const imgCache = new Map(); // res index -> {bmp,x,y} | null
async function getImage(resIdx){
  if (imgCache.has(resIdx)) return imgCache.get(resIdx);
  const p = (async () => {
    const r = game.resolve(game.params.res[resIdx]); if (!r) return null;
    const d = await r.arc.raw(r.ent);
    if (r.ent.webp) return { bmp: await createImageBitmap(new Blob([d], { type:'image/webp' })), x: r.ent.x, y: r.ent.y };
    const im = E.decodeImage(d, r.ent, game.params.key); if (!im) return null;
    const bmp = await createImageBitmap(new ImageData(im.rgba, im.w, im.h));
    return { bmp, x: im.x, y: im.y };
  })();
  imgCache.set(resIdx, p);
  if (imgCache.size > 160) imgCache.delete(imgCache.keys().next().value);
  return p;
}
async function compose(layers){
  const items = [];
  const sorted = layers.slice().sort((a,b)=>a.z-b.z);
  for (const L of sorted){ for (const id of (game.params.imgs[L.img]||[])){ if (id) items.push([getImage(id), L.dx, L.dy]); } }
  const off = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(1024, 600) : Object.assign(document.createElement('canvas'), { width:1024, height:600 }); const c = off.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0,0,1024,600);
  for (const [pr, dx, dy] of items){ const im = await pr; if (im) c.drawImage(im.bmp, im.x + dx, im.y + dy); }
  return off;
}
let shown = null;
async function showState(layers, fade){
  const next = await compose(layers);
  if (play.token !== curToken) return;
  if (!fade || !shown || play.fast){ ctx.drawImage(next,0,0); shown = next; return; }
  const prev = shown; shown = next;
  const t0 = performance.now(), dur = 320;
  await new Promise(res => {
    function f(t){ const a = Math.min(1,(t-t0)/dur); ctx.globalAlpha=1; ctx.drawImage(prev,0,0); ctx.globalAlpha=a; ctx.drawImage(next,0,0); ctx.globalAlpha=1;
      if (a<1 && !play.fast) requestAnimationFrame(f); else { ctx.drawImage(next,0,0); res(); } }
    requestAnimationFrame(f);
  });
}

const urlCache = new Map();
async function audioUrl(resName){
  if (urlCache.has(resName)) return urlCache.get(resName);
  const p = (async()=>{
    let r;
    if (/\.voice\d\d$/.test(resName)){ const [stem, a] = resName.split('.'); const arc = game.arcs[a]; const ent = arc && arc.byStem.get(stem); r = ent && { arc, ent }; }
    else r = game.resolve(resName);
    if (!r) return null;
    return URL.createObjectURL(new Blob([await r.arc.raw(r.ent)], { type:'audio/ogg' }));
  })();
  urlCache.set(resName, p);
  if (urlCache.size > 120){ const k = urlCache.keys().next().value; const old = urlCache.get(k); urlCache.delete(k); old.then(u=>u&&setTimeout(()=>URL.revokeObjectURL(u),60000)); }
  return p;
}
const vol = { bgm:()=>$('rBgm').value/100, se:()=>$('rSe').value/100, vo:()=>$('rVo').value/100 };
const bgmEl = new Audio(); bgmEl.loop = true; let bgmName = null;
async function setBgm(name){
  if (name === bgmName) return; bgmName = name;
  if (!name){ bgmEl.pause(); return; }
  const u = await audioUrl(name); if (bgmName !== name || !u) return;
  bgmEl.src = u; bgmEl.volume = vol.bgm(); bgmEl.play().catch(()=>{});
}
const seCh = {};
async function playSe(ch, name){
  if (ch === 255){ for (const k in seCh){ seCh[k].pause(); } return; }
  const el = seCh[ch] || (seCh[ch] = new Audio());
  if (!name){ el.pause(); el.removeAttribute('src'); return; }
  if (play.fast && ch > 3) return;
  const u = await audioUrl(name); if (!u) return;
  el.loop = ch <= 3 || /ループ|^bgf_/.test(name); el.src = u; el.volume = vol.se(); el.play().catch(()=>{});
}
const voEl = new Audio();
$('rBgm').oninput = () => { bgmEl.volume = vol.bgm(); store.set('vol', volState()); };
$('rSe').oninput = () => { for (const k in seCh) seCh[k].volume = vol.se(); store.set('vol', volState()); };
$('rVo').oninput = () => { voEl.volume = vol.vo(); store.set('vol', volState()); };
$('rSpeed').oninput = () => store.set('vol', volState());
function volState(){ return { b:$('rBgm').value, s:$('rSe').value, v:$('rVo').value, w:$('rSpeed').value }; }
(function(){ const v = store.get('vol'); if (v){ $('rBgm').value=v.b; $('rSe').value=v.s; $('rVo').value=v.v; $('rSpeed').value=v.w; } })();
function stopAudio(){ bgmEl.pause(); bgmName = null; for (const k in seCh) seCh[k].pause(); voEl.pause(); }

// ---------------------------------------------------------------- playback
const play = { auto:true, fast:false, token:0, advance:null, runner:null, steps:[], route:null, common:false, step:0 };
let curToken = 0;
function waitAdvance(ms){
  return new Promise(res => {
    let done = false; const fin = () => { if (!done){ done = true; play.advance = null; clearTimeout(t); res(); } };
    play.advance = fin;
    const t = ms != null ? setTimeout(fin, ms) : null;
  });
}
function setAuto(on){ play.auto = on; $('bAuto').classList.toggle('on', on); $('bAuto').textContent = on ? '▶ オート' : '⏸ 手動'; if (on && play.advance && !play.voicePlaying) play.advance(); }

function makeHost(tk){ const alive = () => tk === curToken; return {
  async state(layers, fade){ if (alive()) await showState(layers, fade); },
  async message(m){
    if (!alive()) return;
    $('box').classList.remove('off');
    $('name').textContent = m.speaker || '';
    $('text').textContent = m.text.replace(/[\uE000-\uF8FF]/g, '太壱');
    if (play.fast){ await new Promise(r=>setTimeout(r, 25)); return; }
    let voiceDone = Promise.resolve();
    voEl.pause();
    if (m.voice){
      const u = await audioUrl(m.voice);
      if (u && alive()){
        voEl.src = u; voEl.volume = vol.vo(); play.voicePlaying = true;
        voiceDone = new Promise(r => { voEl.onended = r; voEl.onerror = r; voEl.play().catch(r); });
        voiceDone.then(()=>{ play.voicePlaying = false; });
      }
    }
    const extra = +$('rSpeed').value;
    if (play.auto){
      // wait for the voice (or reading time) unless the user clicks
      const reading = Math.max(1100, m.text.length * 75);
      const adv = waitAdvance(null);
      const timer = m.voice ? voiceDone.then(()=>new Promise(r=>setTimeout(r, extra))) : new Promise(r=>setTimeout(r, reading + extra));
      await Promise.race([adv, timer.then(()=>{ if (play.advance) play.advance(); })]);
      // switching auto off mid-line waits for a click
      if (!play.auto && alive()) await waitAdvance(null);
    } else {
      await waitAdvance(null);
    }
    if (m.voice && voEl.currentTime > 0 && !voEl.ended) voEl.pause();
  },
  bgm(n){ if (alive()) setBgm(n); },
  se(ch, n){ if (alive()) playSe(ch, n); },
  async wait(ms){ if (alive() && !play.fast) await new Promise(r=>setTimeout(r, ms)); },
  window(on){ if (alive() && !on) $('box').classList.add('off'); },
  call(n){ if (alive()) setTag(n); },
}; }
function label(n){ return n.replace(/\.scr$/,'').replace(/\u3000/g,' '); }
function setTag(n){ $('sceneTag').textContent = label(n); }

function renderSceneList(){
  const ol = $('sceneList'); ol.innerHTML = '';
  play.steps.forEach((st, i) => {
    const li = document.createElement('li'); li.textContent = (i+1) + '. ' + label(st.s);
    li.className = i === play.step ? 'cur' : i < play.step ? 'done' : '';
    li.onclick = () => { $('scenes').classList.add('hidden'); startRoute(play.route, play.common, i); };
    ol.appendChild(li);
  });
  const cur = ol.children[play.step]; if (cur) cur.scrollIntoView({ block:'center' });
}

async function startRoute(route, includeCommon, startAt){
  stopRun();
  const token = ++curToken; play.token = token;
  $('setup').classList.add('hidden'); $('player').classList.remove('hidden'); $('endCard').classList.add('hidden');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,1024,600); shown = null; $('box').classList.add('off');
  play.route = route; play.common = includeCommon;
  play.steps = RT.expand(route, includeCommon, game.fileNames);
  const runner = new E.Runner(game, makeHost(token)); play.runner = runner;
  try{
    await runner.runSteps(play.steps, (i, st) => {
      play.step = i; setTag(st.s);
      $('prog').textContent = route.name + '　' + (i+1) + ' / ' + play.steps.length;
      store.set('last', { id: route.id, common: includeCommon, step: i });
      if (!$('scenes').classList.contains('hidden')) renderSceneList();
    }, startAt);
  }catch(e){ console.error(e); alert('再生中にエラーが発生しました: ' + e.message); }
  if (token !== curToken) return;
  stopAudio(); $('box').classList.add('off');
  $('endText').textContent = route.name + '　おわり';
  $('endCard').classList.remove('hidden');
  store.set('last', null);
}
function stopRun(){
  if (play.runner){ play.runner.stop = true; }
  curToken++; play.token = curToken;
  if (play.advance) play.advance();
  stopAudio();
}
function backToMenu(){ stopRun(); play.fast = false; $('bFast').classList.remove('on'); $('player').classList.add('hidden'); $('setup').classList.remove('hidden'); refreshStart(); }

$('bMenu').onclick = backToMenu; $('endBack').onclick = backToMenu;
$('bAuto').onclick = () => setAuto(!play.auto);
$('bNext').onclick = () => { if (play.advance) play.advance(); };
$('box').onclick = () => { if (play.advance) play.advance(); };
$('cv').onclick = () => { if (play.advance) play.advance(); };
$('bSkipScene').onclick = () => { if (play.runner){ play.runner.abortStep = true; voEl.pause(); for (const k in seCh) seCh[k].pause(); if (play.advance) play.advance(); } };
$('bFast').onclick = () => { play.fast = !play.fast; $('bFast').classList.toggle('on', play.fast); if (play.fast){ voEl.pause(); if (play.advance) play.advance(); } };
$('bVol').onclick = () => $('bar').classList.toggle('showvol');
$('bList').onclick = () => { const s=$('scenes'); s.classList.toggle('hidden'); if (!s.classList.contains('hidden')) renderSceneList(); };
document.addEventListener('keydown', e => {
  if ($('player').classList.contains('hidden')) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (play.advance) play.advance(); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!play.auto);
  else if (e.key === 's' || e.key === 'S') $('bSkipScene').click();
  else if (e.key === 'l' || e.key === 'L') $('bList').click();
  else if (e.key === 'Escape') backToMenu();
  else if (e.key === 'Control' && !play.fast){ play.fast = true; voEl.pause(); if (play.advance) play.advance(); }
});
document.addEventListener('keyup', e => { if (e.key === 'Control'){ play.fast = false; $('bFast').classList.remove('on'); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
