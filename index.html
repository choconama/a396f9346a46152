<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="流し見"><meta name="theme-color" content="#141218">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>流し見ビューア</title>
<style>
:root{--bg:#141218;--panel:#1e1b24;--line:#3a3444;--text:#ece8f1;--muted:#a79fb3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
p{color:var(--muted);font-size:14px;margin:0 0 22px}
a.card{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none}
a.card:active{opacity:.7}
.ic{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.t{font-size:18px;font-weight:600}.s{font-size:13px;color:var(--muted);margin-top:3px}
.ok{color:#7ed99b}
</style></head><body><main>
<h1>流し見ビューア</h1><p>作品を選んでください。</p>
<a class="card" href="love/"><div class="ic" style="background:#e2557a">LH</div><div><div class="t">Love×Holic</div><div class="s" id="s-love">13ルート</div></div></a>
<a class="card" href="mama/"><div class="ic" style="background:#7a60e2">ML</div><div><div class="t">Mama×Holic</div><div class="s" id="s-mama">14ルート</div></div></a>
</main>
<script>
(async()=>{try{const dbs=await indexedDB.databases();const names=dbs.map(d=>d.name);
 if(names.includes('lhviewer'))document.getElementById('s-love').innerHTML='13ルート ・ <span class="ok">データ読み込み済み</span>';
 if(names.includes('lhviewer-mama'))document.getElementById('s-mama').innerHTML='14ルート ・ <span class="ok">データ読み込み済み</span>';}catch(e){}})();
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
